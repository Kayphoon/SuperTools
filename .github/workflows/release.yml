name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0, defaults to latest)"
        required: false
        default: "latest"

permissions:
  contents: write

jobs:
  release-macos:
    name: build & release (macos-15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test

      - name: Package signed macOS app & zip archive
        env:
          SUPERTOOLS_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag || '0.1.0' }}
        run: ./scripts/package-mac.sh --zip

      - name: Verify release artifacts
        run: |
          codesign --verify --deep --strict dist/SuperTools.app
          (cd dist && shasum -a 256 -c SuperTools-macos-arm64.zip.sha256)
          ls -lh dist/SuperTools-macos-arm64.zip*

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperTools-macos-arm64
          path: |
            dist/SuperTools-macos-arm64.zip
            dist/SuperTools-macos-arm64.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('SuperTools {0}', github.ref_name) || 'SuperTools Latest' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
          files: |
            dist/SuperTools-macos-arm64.zip
            dist/SuperTools-macos-arm64.zip.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
